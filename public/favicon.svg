<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fantasy Draft Compass: bold compass rose (the star) with a faint football hint behind it. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#14120B"/>
  <g transform="translate(32,32) scale(0.6) translate(-50,-50)">
    <!-- faint football hint -->
    <g transform="rotate(-38 50 50)" opacity="0.18">
      <path d="M50 33 C61 33 71 40 71 50 C71 60 61 67 50 67 C39 67 29 60 29 50 C29 40 39 33 50 33 Z" fill="none" stroke="#F2B63C" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="42" y1="50" x2="58" y2="50" stroke="#F2B63C" stroke-width="1.2"/>
      <line x1="45.5" y1="47.5" x2="45.5" y2="52.5" stroke="#F2B63C" stroke-width="1" stroke-linecap="round"/>
      <line x1="48.5" y1="47.5" x2="48.5" y2="52.5" stroke="#F2B63C" stroke-width="1" stroke-linecap="round"/>
      <line x1="51.5" y1="47.5" x2="51.5" y2="52.5" stroke="#F2B63C" stroke-width="1" stroke-linecap="round"/>
      <line x1="54.5" y1="47.5" x2="54.5" y2="52.5" stroke="#F2B63C" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- compass rose (the star) -->
    <circle cx="50" cy="50" r="47" fill="none" stroke="#F2B63C" stroke-width="2.4" opacity="0.95"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#3A4757" stroke-width="1" opacity="0.5"/>
    <g stroke="#F2B63C" stroke-width="2.2" stroke-linecap="round">
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(0 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(90 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(180 50 50)"/>
      <line x1="50" y1="4" x2="50" y2="13" transform="rotate(270 50 50)"/>
    </g>
    <g stroke="#3A4757" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(30 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(60 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(120 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(150 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(210 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(240 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(300 50 50)"/>
      <line x1="50" y1="6" x2="50" y2="10" transform="rotate(330 50 50)"/>
    </g>
    <!-- rose star -->
    <polygon points="50,15 53,50 50,50" fill="#F2B63C" transform="rotate(0 50 50)"/>
    <polygon points="50,15 47,50 50,50" fill="#FFD071" opacity="0.8" transform="rotate(0 50 50)"/>
    <polygon points="50,15 53,50 50,50" fill="#F2B63C" transform="rotate(90 50 50)"/>
    <polygon points="50,15 47,50 50,50" fill="#FFD071" opacity="0.8" transform="rotate(90 50 50)"/>
    <polygon points="50,15 53,50 50,50" fill="#F2B63C" transform="rotate(180 50 50)"/>
    <polygon points="50,15 47,50 50,50" fill="#FFD071" opacity="0.8" transform="rotate(180 50 50)"/>
    <polygon points="50,15 53,50 50,50" fill="#F2B63C" transform="rotate(270 50 50)"/>
    <polygon points="50,15 47,50 50,50" fill="#FFD071" opacity="0.8" transform="rotate(270 50 50)"/>
    <circle cx="50" cy="50" r="3" fill="#F2B63C"/>
    <circle cx="50" cy="50" r="1.3" fill="#14120B"/>
  </g>
</svg>
